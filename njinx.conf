server
{
    listen 80;
    listen 443 ssl http2;
    server_name lordfilmhd-smotret.online www.lordfilmhd-smotret.online;

    # Корень можно оставить, но SSR не должен отдавать /index.html напрямую
    root /www/wwwroot/lordfilmhd-smotret.online;
    index index.html index.htm;

    # --- Генератор изображений (Node: /img?src=...&w=&q=&f=...) ---
    location /img {
        proxy_pass http://127.0.0.1:3002$request_uri;  # проверь порт (должен совпадать с server.js)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- API (Node) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSR для главной (/) ---
    location = / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SSR для роутов приложения (категории и страницы фильмов) ---
    location ~ ^/(filmy|serialy|multfilmy|anime|tops)(/.*)?$ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- sitemap/robots на Node ---
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Раздача загруженных файлов (uploads) ---
    location ^~ /uploads/ {
        alias /www/wwwroot/lordfilmhd-smotret.online/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --- Кэширование ассетов Vite (из клиентской сборки) ---
    location ^~ /assets/ {
        alias /www/wwwroot/lordfilmhd-smotret.online/dist/client/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Файлы из /vendor (если нужны как статика)
    location ^~ /vendor/ {
        alias /www/wwwroot/lordfilmhd-smotret.online/public/vendor/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Шрифты
    location ~* \.(woff2|woff)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Картинки
    location ~* \.(png|jpe?g|webp|gif|svg)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Прочие не‑хэшированные js/css
    location ~* \.(js|css)$ {
        access_log off;
        expires 12h;
        add_header Cache-Control "public, max-age=43200";
        try_files $uri =404;
    }

    # --- Главное правило: ВСЁ остальное отдаёт Node SSR ---
    location / {
        proxy_pass http://127.0.0.1:3002;  # <-- поставь порт твоего Node
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/lordfilmhd-smotret.online.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/lordfilmhd-smotret.online/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/lordfilmhd-smotret.online/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    include /www/server/panel/vhost/nginx/redirect/lordfilmhd-smotret.online/*.conf;

    #ERROR-PAGE-START  Error page configuration, allowed to be commented
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/lordfilmhd-smotret.online.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { return 404; }

    # SSL certificate verification
    location ~ \.well-known { allow all; }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    access_log  /www/wwwlogs/lordfilmhd-smotret.online.log;
    error_log   /www/wwwlogs/lordfilmhd-smotret.online.error.log;
}