server {
    listen 80;
    server_name kino.lordfilmshd-2026.ru www.kino.lordfilmshd-2026.ru;

    # ACME до редиректа!
    include /www/server/panel/vhost/nginx/well-known/kino.lordfilmshd-2026.ru.conf;

    return 301 https://kino.lordfilmshd-2026.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.kino.lordfilmshd-2026.ru;

    ssl_certificate     /www/server/panel/vhost/cert/kino.lordfilmshd-2026.ru/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kino.lordfilmshd-2026.ru/privkey.pem;

    return 301 https://kino.lordfilmshd-2026.ru$request_uri;
}
server {
    # СЛУШАЕМ ПОРТ 443 (SSL)
    listen 443 ssl http2;
    server_name kino.lordfilmshd-2026.ru;

    # ПУТИ К СЕРТИФИКАТАМ (Стандартные пути aaPanel)
    ssl_certificate /www/server/panel/vhost/cert/kino.lordfilmshd-2026.ru/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/kino.lordfilmshd-2026.ru/privkey.pem;

    # НАСТРОЙКИ БЕЗОПАСНОСТИ SSL
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    # Дальше идет ваш старый конфиг...
    root /www/wwwroot/kino.lordfilmshd-2026.ru;
    index index.html index.htm;

    # --- Генератор изображений (Node: /img?src=...&w=&q=&f=...) ---
    location /img {
        # запрет внешнего хотлинка (только со страниц твоего домена)
        valid_referers none blocked server_names *.kino.lordfilmshd-2026.ru;
        if ($invalid_referer) { return 403; }

        limit_req zone=img burst=60 delay=20;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;

        # Прокси-кэш
        proxy_cache img_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_504;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://127.0.0.1:3002$request_uri;
    }

    # Кэшируем прокси-скрипты JS, чтобы не дергать Node лишний раз
    location = /api/ym-tag.js        { proxy_cache fast; proxy_cache_valid 200 30d; proxy_pass http://127.0.0.1:3002; }
    location = /api/cdnvh-umd.js     { proxy_cache fast; proxy_cache_valid 200 30d; proxy_pass http://127.0.0.1:3002; }
    location = /api/cdnvh-playerui.js{ proxy_cache fast; proxy_cache_valid 200 30d; proxy_pass http://127.0.0.1:3002; }

    # --- API (Node, GET — кэшируем на 10с + мягкий лимит) ---
    location ^~ /api/ {
        limit_req zone=api burst=60 delay=20;

        proxy_cache fast;
        proxy_cache_valid 200 10s;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # По умолчанию .txt закрыты
    location ~* \.txt$ { return 403; }
    
    # Ключ IndexNow — разрешаем
    location = /abcd1234abcd1234abcd1234abcd1234.txt {
        access_log off;
        default_type text/plain;        try_files $uri =404;
    }

    # --- Динамический sitemap на Node ---
    location = /sitemap.xml {
        proxy_cache fast;
        proxy_cache_valid 200 10m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- robots.txt с Node ---
    location = /robots.txt {
        proxy_cache fast;
        proxy_cache_valid 200 10m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- favicon: отдаём SVG по пути /favicon.ico, чтобы не было 404 ---
    location = /favicon.ico {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/assets/NewLord_site/images/favicon.svg;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { }
        default_type image/svg+xml;
    }

    # --- favicon: добавляем явную раздачу по пути /favicon.svg ---
    location = /favicon.svg {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/assets/NewLord_site/images/favicon.svg;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { }
        default_type image/svg+xml;
    }

    # --- Раздача загруженных файлов (uploads) ---
    location ^~ /uploads/ {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/uploads/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # --- Кэширование ассетов Vite (из клиентской сборки) ---
    location ^~ /assets/ {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/dist/client/assets/;
        access_log off;
        expires 1y;        try_files $uri =404;
    }

    location ^~ /assets/NewLord_site/ {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/assets/NewLord_site/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }
    # и оставить текущий блок для /assets/ (Vite)

    # Файлы из /vendor (если нужны как статика)
    location ^~ /vendor/ {
        alias /www/wwwroot/kino.lordfilmshd-2026.ru/public/vendor/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # Шрифты
    location ~* \.(woff2|woff)$ {
        access_log off;
        expires 1y;        try_files $uri =404;
    }

    # Картинки
    location ~* \.(png|jpe?g|webp|gif|svg)$ {
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # Прочие не‑хэшированные js/css
    location ~* \.(js|css)$ {
        access_log off;
        expires 12h;        try_files $uri =404;
    }

    # --- Главное правило: ВСЁ остальное отдаёт Node SSR (микро‑кэш 3с) ---
    location / {
        if ($block_ua) { return 403; }
        proxy_cache fast;
        proxy_cache_valid 200 3s;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location ~* ^/(config\.env|\.env|server\.js|package\.json|movies-data\.json)$ {
        return 403;
    }

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/kino.lordfilmshd-2026.ru.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/redirect/kino.lordfilmshd-2026.ru/*.conf;

    #ERROR-PAGE-START
    error_page 404 =404 /404.html;
    
    location = /404.html {
        root /www/wwwroot/kino.lordfilmshd-2026.ru;
        internal;    }
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/kino.lordfilmshd-2026.ru.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { return 404; }

    # SSL certificate verification
    location ~ \.well-known { allow all; }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    access_log  /www/wwwlogs/kino.lordfilmshd-2026.ru.log;
    error_log   /www/wwwlogs/kino.lordfilmshd-2026.ru.error.log;
}