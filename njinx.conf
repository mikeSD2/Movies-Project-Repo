server {
    listen 80;
    server_name prosmotrzone.online www.prosmotrzone.online;

    # ACME до редиректа!
    include /www/server/panel/vhost/nginx/well-known/prosmotrzone.online.conf;

    return 301 https://prosmotrzone.online$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.prosmotrzone.online;
    ssl_certificate     /www/server/panel/vhost/cert/prosmotrzone.online/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/prosmotrzone.online/privkey.pem;

    return 301 https://prosmotrzone.online$request_uri;
}
server {
    listen 443 ssl http2;
    server_name prosmotrzone.online;
    ssl_certificate     /www/server/panel/vhost/cert/prosmotrzone.online/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/prosmotrzone.online/privkey.pem;

    root /www/wwwroot/prosmotrzone.online;
    index index.html index.htm;

    # --- Генератор изображений (Node: /img?src=...&w=&q=&f=...) ---
    location /img {
        # запрет внешнего хотлинка (только со страниц твоего домена)
        valid_referers none blocked server_names *.prosmotrzone.online;
        if ($invalid_referer) { return 403; }

        limit_req zone=img burst=60 delay=20;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;

        # Прокси-кэш
        proxy_cache img_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_504;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://127.0.0.1:3002$request_uri;
    }

    # Кэшируем прокси-скрипты JS, чтобы не дергать Node лишний раз
    location = /api/cdnvh-umd.js     { proxy_cache fast; proxy_cache_valid 200 30d; proxy_pass http://127.0.0.1:3002; }
    location = /api/cdnvh-playerui.js{ proxy_cache fast; proxy_cache_valid 200 30d; proxy_pass http://127.0.0.1:3002; }

    # --- API (Node, GET — кэшируем на 10с + мягкий лимит) ---
    location ^~ /api/ {
        limit_req zone=api burst=60 delay=20;

        proxy_cache fast;
        proxy_cache_valid 200 10s;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # По умолчанию .txt закрыты
    location ~* \.txt$ { return 403; }
    
    # Ключ IndexNow — разрешаем
    location = /abcd1234abcd1234abcd1234abcd1234.txt {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # --- Динамический sitemap на Node ---
    location = /sitemap.xml {
        proxy_cache fast;
        proxy_cache_valid 200 10m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- robots.txt с Node ---
    location = /robots.txt {
        proxy_cache fast;
        proxy_cache_valid 200 10m;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Раздача загруженных файлов (uploads) ---
    location ^~ /uploads/ {
        alias /www/wwwroot/prosmotrzone.online/uploads/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # --- Кэширование ассетов Vite (из клиентской сборки) ---
    location ^~ /assets/ {
        alias /www/wwwroot/prosmotrzone.online/dist/client/assets/;
        access_log off;
        expires 1y;        try_files $uri =404;
    }

    location ^~ /assets/ProsmotrZone_site/ {
        alias /www/wwwroot/prosmotrzone.online/assets/ProsmotrZone_site/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }
    # и оставить текущий блок для /assets/ (Vite)

    # Файлы из /vendor (если нужны как статика)
    location ^~ /vendor/ {
        alias /www/wwwroot/prosmotrzone.online/public/vendor/;
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # Шрифты
    location ~* \.(woff2|woff)$ {
        access_log off;
        expires 1y;        try_files $uri =404;
    }

    # Картинки
    location ~* \.(png|jpe?g|webp|gif|svg)$ {
        access_log off;
        expires 30d;        try_files $uri =404;
    }

    # Прочие не‑хэшированные js/css
    location ~* \.(js|css)$ {
        access_log off;
        expires 12h;        try_files $uri =404;
    }

    # --- Главное правило: ВСЁ остальное отдаёт Node SSR (микро‑кэш 3с) ---
    location / {
        if ($block_ua) { return 403; }
        proxy_cache fast;
        proxy_cache_valid 200 3s;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location ~* ^/(config\.env|\.env|server\.js|package\.json|movies-data\.json)$ {
        return 403;
    }

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/prosmotrzone.online.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/redirect/prosmotrzone.online/*.conf;

    #ERROR-PAGE-START
    error_page 404 =404 /404.html;
    
    location = /404.html {
        root /www/wwwroot/prosmotrzone.online;
        internal;    }
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/prosmotrzone.online.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) { return 404; }

    # SSL certificate verification
    location ~ \.well-known { allow all; }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { return 403; }

    access_log  /www/wwwlogs/prosmotrzone.online.log;
    error_log   /www/wwwlogs/prosmotrzone.online.error.log;
}